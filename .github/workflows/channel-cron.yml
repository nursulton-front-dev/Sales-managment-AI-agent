name: Channel Events Recovery Cron

on:
  schedule:
    # Run every 5 minutes to ensure robust queue retries independent of incoming traffic on Vercel Hobby
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  drain-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Queue Recovery
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error ::CRON_SECRET is not configured in GitHub Secrets. Channel event recovery cannot run without valid secret."
            exit 1
          fi
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://chorla-ai.vercel.app/api/cron/channel-events" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          STATUS=$(echo "$RESPONSE" | grep "^HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "^HTTP_STATUS:")
          echo "Status: $STATUS"
          echo "Response: $BODY"
          if [ "$STATUS" -ne 200 ]; then
            echo "Queue recovery call returned unexpected HTTP status $STATUS"
            exit 1
          fi
