<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" class="look" role="img" aria-label="Воробей gapcha AI: страница не найдена"><style>svg{overflow:visible}.bird{transform-origin:160px 200px;animation:tilt 1.8s ease-in-out 1}.head{transform-origin:175px 145px;animation:head-tilt 1.8s ease-in-out 1}
@keyframes tilt{0%,100%{transform:rotate(0)}35%{transform:rotate(-6deg)}70%{transform:rotate(4deg)}}
@keyframes head-tilt{0%,100%{transform:rotate(0)}40%{transform:rotate(-10deg)}75%{transform:rotate(6deg)}}
@media(prefers-reduced-motion:reduce){.bird,.head{animation:none!important}}</style>
<!-- Signpost (clean minimalist wooden pointer with "404" cue) -->
<g class="signpost" stroke="#151515" stroke-width="3" stroke-linejoin="round">
  <line x1="60" y1="90" x2="60" y2="265" stroke-width="6" stroke-linecap="round"/>
  <!-- Directional arrow plaque pointing right -->
  <path fill="#F8F6F1" d="M38 100 L95 100 L115 116 L95 132 L38 132 Z"/>
  <circle cx="60" cy="116" r="3" fill="#151515"/>
</g>

<g class="bird">
  <!-- Tail -->
  <path fill="#C91E26" d="M120 186 L63 162 L81 193 L59 213 L127 220 Z"/>
  <!-- Feet -->
  <g class="feet" fill="none" stroke="#151515" stroke-width="7" stroke-linecap="round">
    <path d="M155 242v22h-15M198 242v22h14"/>
  </g>
  <!-- Body -->
  <path fill="#ED262A" d="M120 218C96 190 104 141 134 111L126 80 156 94 165 72 183 99C225 94 257 127 258 171 260 219 230 251 185 251 158 251 136 239 120 218Z"/>
  <!-- Belly -->
  <path fill="#F8F6F1" d="M150 241C144 211 162 192 187 195 218 199 227 223 223 240 198 254 171 254 150 241Z"/>
  <ellipse cx="172" cy="168" rx="14" ry="10" fill="#FCE4E1" opacity="0.85"/>
  
  <g class="head">
    <!-- Curious eyes (looking sideways/up) -->
    <g class="eyes">
      <ellipse fill="#fff" cx="186" cy="146" rx="17" ry="23"/>
      <ellipse fill="#fff" cx="228" cy="142" rx="15" ry="21"/>
      <ellipse fill="#151515" cx="190" cy="147" rx="8" ry="13"/>
      <ellipse fill="#151515" cx="231" cy="143" rx="7" ry="12"/>
      <circle fill="white" cx="193" cy="141" r="3"/>
      <circle fill="white" cx="233" cy="138" r="2.5"/>
    </g>
    <!-- Beak -->
    <path fill="#151515" d="m206 165 27-3-14 20Z"/>
  </g>

  <!-- Wing folded with slight curious lift -->
  <g class="wing">
    <path fill="#BF1C27" d="M157 174Q128 163 109 180L91 211 116 206 108 221Q147 218 157 174Z"/>
    <path fill="#A81720" d="M150 178Q128 172 114 186L102 208L118 204L112 216Q144 214 150 178Z"/>
  </g>
</g></svg>
