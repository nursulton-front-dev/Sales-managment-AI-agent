<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" class="hello" role="img" aria-label="Воробей: Спокойная поза"><style>svg{overflow:visible}.bird{transform-origin:160px 190px}.wing{transform-origin:130px 178px}.eyes{transform-origin:190px 146px;animation:blink 5s infinite}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
.loading .bird{animation:hover 1.7s ease-in-out infinite}.loading .wing{animation:flap .85s ease-in-out infinite}.hello .wing{animation:wave 1.8s ease-in-out 2}.success .bird{animation:hop 1.1s ease-in-out 1}.success .wing{animation:wave 1.1s ease-in-out 1}
@keyframes hover{50%{transform:translateY(-12px) rotate(-3deg)}}@keyframes flap{50%{transform:rotate(55deg)}}@keyframes wave{0%,100%{transform:rotate(0)}25%,65%{transform:rotate(115deg)}45%,80%{transform:rotate(75deg)}}@keyframes hop{0%,100%{transform:translateY(0)}25%{transform:translateY(3px) scaleY(.96)}55%{transform:translateY(-24px) rotate(-6deg)}80%{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.bird,.wing,.eyes{animation:none!important}}.bird,.wing,.eyes{animation:none!important}</style><g class="bird">
