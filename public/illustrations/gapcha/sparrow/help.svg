<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none" role="img" aria-label="Воробей gapcha AI: поддержка и помощь">
  <!-- Supportive Aura Sparkle -->
  <g class="support-sparkle">
    <path fill="#ED262A" d="M224 80 L227 90 L237 93 L227 96 L224 106 L221 96 L211 93 L221 90 Z" opacity="0.85"/>
  </g>

  <!-- Tail -->
  <path fill="#C91E26" d="M102 186 L40 160 L59 193 L36 214 L108 220 Z"/>
  <path fill="#A81720" d="M84 188 L48 171 L60 193 L46 207 L90 210 Z"/>

  <!-- Feet -->
  <g stroke="#151515" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M138 244 v22 h-16"/>
    <path d="M182 244 v22 h16"/>
  </g>

  <!-- Main Body (gapcha red) -->
  <path fill="#ED262A" d="M100 220 C74 190 82 140 114 110 L106 80 L136 94 L145 72 L163 100 C206 95 238 128 239 172 C241 220 210 252 166 252 C138 252 116 240 100 220 Z"/>

  <!-- Ivory Breast / Belly Patch (Broad, welcoming) -->
  <path fill="#F8F6F1" d="M128 244 C122 212 142 192 168 196 C198 200 208 224 204 244 C178 256 150 256 128 244 Z"/>

  <!-- Cheerful Warm Blush -->
  <ellipse cx="152" cy="170" rx="15" ry="11" fill="#FCE4E1" opacity="0.9"/>

  <!-- Kind, Attentive Eyes (Supportive and receptive) -->
  <g class="eyes">
    <ellipse cx="166" cy="144" rx="17" ry="23" fill="#FFFFFF"/>
    <ellipse cx="208" cy="140" rx="15" ry="21" fill="#FFFFFF"/>
    <ellipse cx="173" cy="145" rx="8" ry="13" fill="#151515"/>
    <ellipse cx="214" cy="141" rx="7" ry="12" fill="#151515"/>
    <circle cx="176" cy="139" r="3.2" fill="#FFFFFF"/>
    <circle cx="216" cy="136" r="2.8" fill="#FFFFFF"/>
  </g>

  <!-- Small Sharp Beak (Attentive, slightly open to speak) -->
  <path fill="#151515" d="M186 163 L218 160 L198 181 Z"/>

  <!-- Welcoming Open Support Wing -->
  <g class="support-wing">
    <path fill="#BF1C27" d="M138 174 C156 150 184 136 216 130 L202 148 L220 150 L198 176 C174 186 152 188 138 174 Z"/>
    <path fill="#A81720" d="M132 184 C112 176 96 190 84 212 L102 206 L96 218 C124 216 132 188 132 184 Z"/>
  </g>
</svg>