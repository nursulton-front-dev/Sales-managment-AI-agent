<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none" role="img" aria-label="Воробей gapcha AI: успешно выполнено">
  <!-- Victory Star Sparkles -->
  <g class="sparkles">
    <!-- Main 4-point star -->
    <path fill="#ED262A" d="M236 48 L241 68 L261 73 L241 78 L236 98 L231 78 L211 73 L231 68 Z"/>
    <circle cx="236" cy="73" r="3.5" fill="#F8F6F1"/>
    <!-- Small secondary sparkle -->
    <path fill="#ED262A" d="M268 40 L270 47 L277 49 L270 51 L268 58 L266 51 L259 49 L266 47 Z" opacity="0.8"/>
  </g>

  <!-- Tail (Perked Up Triumphantly) -->
  <path fill="#C91E26" d="M98 180 L32 144 L54 180 L28 202 L104 212 Z"/>
  <path fill="#A81720" d="M78 180 L42 158 L54 182 L38 196 L86 202 Z"/>

  <!-- Feet (Light energetic spring) -->
  <g stroke="#151515" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M136 240 v24 h-16"/>
    <path d="M180 240 v24 h16"/>
  </g>

  <!-- Back Wing (Raised Left Wing) -->
  <path fill="#A81720" d="M88 152 C98 116 122 88 144 76 L134 98 L152 96 L136 126 C116 142 98 150 88 152 Z"/>

  <!-- Main Body (gapcha red) -->
  <path fill="#ED262A" d="M96 214 C70 184 78 134 110 104 L102 74 L132 88 L141 66 L159 94 C202 89 234 122 235 166 C237 214 206 246 162 246 C134 246 112 234 96 214 Z"/>

  <!-- Ivory Breast / Belly Patch -->
  <path fill="#F8F6F1" d="M124 238 C118 206 138 186 164 190 C194 194 204 218 200 238 C174 250 146 250 124 238 Z"/>

  <!-- Cheerful Rosy Cheek -->
  <ellipse cx="146" cy="164" rx="15" ry="11" fill="#FCE4E1" opacity="0.95"/>

  <!-- Joyful, Confident Eyes (Curved happy glance) -->
  <g class="eyes">
    <ellipse cx="162" cy="140" rx="17" ry="23" fill="#FFFFFF"/>
    <ellipse cx="204" cy="136" rx="15" ry="21" fill="#FFFFFF"/>
    <ellipse cx="169" cy="139" rx="8.5" ry="13.5" fill="#151515"/>
    <ellipse cx="210" cy="135" rx="7.5" ry="12.5" fill="#151515"/>
    <circle cx="173" cy="133" r="3.5" fill="#FFFFFF"/>
    <circle cx="213" cy="130" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Small Sharp Beak (Proud, smiling) -->
  <path fill="#151515" d="M182 159 L214 156 L196 178 Z"/>

  <!-- Front Wing (Raised Triumphant Wing) -->
  <g class="victory-wing">
    <path fill="#BF1C27" d="M144 164 C162 128 194 92 226 74 L212 100 L234 96 L210 128 C182 148 158 160 144 164 Z"/>
    <path fill="#A81720" d="M154 158 C170 130 194 102 220 86 L212 104 L226 100 L206 128 C184 144 164 156 154 158 Z"/>
  </g>
</svg>