<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none" role="img" aria-label="Воробей gapcha AI: анализ и размышление">
  <!-- Thought Sparkles / Dots (clean vector accents) -->
  <circle cx="186" cy="64" r="3.5" fill="#ED262A" opacity="0.7"/>
  <circle cx="204" cy="50" r="5" fill="#ED262A" opacity="0.85"/>
  <path fill="#ED262A" d="M228 32 L231 42 L241 45 L231 48 L228 58 L225 48 L215 45 L225 42 Z"/>

  <!-- Tail -->
  <path fill="#C91E26" d="M102 184 L40 156 L59 190 L36 211 L108 218 Z"/>
  <path fill="#A81720" d="M84 186 L48 168 L60 190 L46 204 L90 208 Z"/>

  <!-- Feet -->
  <g stroke="#151515" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M138 242 v22 h-16"/>
    <path d="M182 242 v22 h16"/>
  </g>

  <!-- Main Body (gapcha red) -->
  <path fill="#ED262A" d="M100 218 C74 188 82 138 114 108 L106 78 L136 92 L145 70 L163 98 C206 93 238 126 239 170 C241 218 210 250 166 250 C138 250 116 238 100 218 Z"/>

  <!-- Ivory Breast / Belly Patch -->
  <path fill="#F8F6F1" d="M128 242 C122 210 142 190 168 194 C198 198 208 222 204 242 C178 254 150 254 128 242 Z"/>

  <!-- Cheek Accent -->
  <ellipse cx="148" cy="168" rx="14" ry="10" fill="#FCE4E1" opacity="0.85"/>

  <!-- Eyes Looking Up in Contemplation (Thoughtful, intelligent, no angry brow) -->
  <g class="eyes">
    <ellipse cx="166" cy="144" rx="17" ry="23" fill="#FFFFFF"/>
    <ellipse cx="208" cy="140" rx="15" ry="21" fill="#FFFFFF"/>
    <ellipse cx="173" cy="138" rx="8" ry="12" fill="#151515"/>
    <ellipse cx="214" cy="134" rx="7" ry="11" fill="#151515"/>
    <circle cx="177" cy="133" r="3" fill="#FFFFFF"/>
    <circle cx="217" cy="130" r="2.6" fill="#FFFFFF"/>
  </g>

  <!-- Small Sharp Beak -->
  <path fill="#151515" d="M186 163 L216 160 L200 182 Z"/>

  <!-- Thoughtful Wing (Tilted upward near chin/beak) -->
  <g class="thinking-wing">
    <path fill="#BF1C27" d="M132 186 C124 162 142 148 168 152 L178 142 L172 162 L186 156 C176 182 152 208 132 186 Z"/>
    <path fill="#A81720" d="M128 190 C108 178 88 194 72 214 L94 208 L88 222 C120 220 130 196 128 190 Z"/>
  </g>
</svg>