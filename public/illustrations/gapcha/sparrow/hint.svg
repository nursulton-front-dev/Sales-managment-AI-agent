<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none" role="img" aria-label="Воробей gapcha AI: подсказка">
  <!-- Directional Hint Sparkle -->
  <g class="hint-sparkle">
    <path fill="#ED262A" d="M250 146 L253 158 L265 161 L253 164 L250 176 L247 164 L235 161 L247 158 Z"/>
    <circle cx="250" cy="161" r="2.5" fill="#F8F6F1"/>
  </g>

  <!-- Tail -->
  <path fill="#C91E26" d="M98 186 L36 160 L55 193 L32 214 L104 220 Z"/>
  <path fill="#A81720" d="M80 188 L44 172 L56 193 L42 206 L86 210 Z"/>

  <!-- Feet (Planted firmly forward) -->
  <g stroke="#151515" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M136 244 v22 h-16"/>
    <path d="M180 244 v22 h16"/>
  </g>

  <!-- Main Body (gapcha red) -->
  <path fill="#ED262A" d="M96 220 C70 190 78 140 110 110 L102 80 L132 94 L141 72 L159 100 C202 95 234 128 235 172 C237 220 206 252 162 252 C134 252 112 240 96 220 Z"/>

  <!-- Ivory Breast / Belly Patch -->
  <path fill="#F8F6F1" d="M124 244 C118 212 138 192 164 196 C194 200 204 224 200 244 C174 256 146 256 124 244 Z"/>

  <!-- Cheek Accent -->
  <ellipse cx="148" cy="170" rx="14" ry="10" fill="#FCE4E1" opacity="0.85"/>

  <!-- Focused Guiding Eyes (Looking intently toward the hinted action) -->
  <g class="eyes">
    <ellipse cx="162" cy="144" rx="17" ry="23" fill="#FFFFFF"/>
    <ellipse cx="204" cy="140" rx="15" ry="21" fill="#FFFFFF"/>
    <ellipse cx="171" cy="145" rx="8" ry="13" fill="#151515"/>
    <ellipse cx="212" cy="141" rx="7" ry="12" fill="#151515"/>
    <circle cx="175" cy="139" r="3.2" fill="#FFFFFF"/>
    <circle cx="215" cy="136" r="2.8" fill="#FFFFFF"/>
  </g>

  <!-- Small Sharp Beak -->
  <path fill="#151515" d="M182 163 L212 160 L196 182 Z"/>

  <!-- Pointing Wing (Extended gracefully to point at next step) -->
  <g class="pointing-wing">
    <path fill="#BF1C27" d="M136 178 C162 172 194 166 238 160 L214 176 L234 180 L204 198 C172 198 148 192 136 178 Z"/>
    <path fill="#A81720" d="M144 182 C166 178 190 172 224 168 L208 178 L220 182 L198 194 C174 194 154 190 144 182 Z"/>
  </g>
</svg>